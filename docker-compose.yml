services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: proyecnube-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - mariadb
      - redis
      - mailpit

  nginx:
    image: nginx:alpine
    container_name: proyecnube-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mariadb:
    image: mariadb:11
    container_name: proyecnube-mariadb
    environment:
      MARIADB_DATABASE: proyecnube
      MARIADB_USER: proyecnube
      MARIADB_PASSWORD: 1234
      MARIADB_ROOT_PASSWORD: 1234
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: proyecnube-redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: proyecnube-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mariadb_data:
